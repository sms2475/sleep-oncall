<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sleep On-Call Roster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
img{max-width:100%}
[hidden]:not([hidden=until-found]){display:none!important}

:root{
  --paper:#EEF2F1;
  --surface:#FFFFFF;
  --surface-2:#E4EAE8;
  --ink:#16232B;
  --muted:#52636B;
  --line:rgba(22,35,43,0.12);
  --accent:#1C8C82;
  --accent-ink:#0B4A45;
  --accent-soft:#DCF0EC;
  --status:#C97A2E;
  --status-soft:#FBE9D6;
  --changed:#B8952A;
  --changed-bg:#FFF6D6;
  --changed-soft:#FFF3B0;
  --changed-ink:#8A6D1B;
  --shadow: 0 1px 2px rgba(22,35,43,0.06), 0 8px 24px rgba(22,35,43,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A1C;
    --surface:#16262A;
    --surface-2:#1D2F33;
    --ink:#E4EEEC;
    --muted:#93A6A4;
    --line:rgba(228,238,236,0.12);
    --accent:#4FD1C0;
    --accent-ink:#B7F1E8;
    --accent-soft:#173733;
    --status:#E8A94A;
    --status-soft:#3A2A14;
    --changed:#C9A83D;
    --changed-bg:#3A331A;
    --changed-soft:#4A3D14;
    --changed-ink:#F5E08A;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A1C;
  --surface:#16262A;
  --surface-2:#1D2F33;
  --ink:#E4EEEC;
  --muted:#93A6A4;
  --line:rgba(228,238,236,0.12);
  --accent:#4FD1C0;
  --accent-ink:#B7F1E8;
  --accent-soft:#173733;
  --status:#E8A94A;
  --status-soft:#3A2A14;
  --changed:#C9A83D;
  --changed-bg:#3A331A;
  --changed-soft:#4A3D14;
  --changed-ink:#F5E08A;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:'Source Serif 4', Georgia, serif;
  text-wrap:balance;
  margin:0;
}
.mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ---------- Gate ---------- */
#gate{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.gate-card{
  width:100%;
  max-width:380px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:36px 32px 32px;
}
.gate-eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent-ink);
  margin-bottom:14px;
}
.gate-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--status);
  box-shadow:0 0 0 4px var(--status-soft);
}
.gate-card h1{ font-size:26px; line-height:1.2; margin-bottom:6px; }
.gate-card p.sub{ color:var(--muted); margin-bottom:26px; line-height:1.5; }
.field-label{
  display:block; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); margin-bottom:6px; font-weight:500;
}
.gate-input{
  width:100%;
  padding:11px 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  margin-bottom:16px;
}
#gate-error{
  color:var(--status);
  font-size:13px;
  min-height:18px;
  margin-bottom:10px;
  margin-top:-8px;
}
#unlock-btn{
  width:100%;
  padding:12px 14px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:var(--surface);
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:opacity .15s ease;
}
#unlock-btn:hover{ opacity:.9; }
.gate-foot{
  margin-top:20px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:12.5px;
  color:var(--muted);
  line-height:1.5;
}

/* ---------- App ---------- */
#app{ display:none; min-height:100vh; }
.wrap{ max-width:760px; margin:0 auto; padding:32px 20px 60px; }

header.top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
header.top h1{ font-size:24px; }
header.top .subtitle{ color:var(--muted); font-size:13px; margin-top:4px; }
.updated{ font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:20px;
  border-bottom:1px solid var(--line);
}
.tab{
  padding:9px 16px;
  font-size:13.5px;
  font-weight:500;
  color:var(--muted);
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  cursor:pointer;
  margin-bottom:-1px;
}
.tab.active{
  color:var(--accent-ink);
  border-bottom-color:var(--accent);
}
.tab[disabled]{ opacity:.45; cursor:not-allowed; }

/* Now card */
.now-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:22px 24px;
  margin-bottom:26px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.now-badge{
  display:flex; align-items:center; gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--status);
}
.now-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--status);
  box-shadow:0 0 0 4px var(--status-soft);
  flex:none;
}
.now-name{ font-family:'Source Serif 4', Georgia, serif; font-size:30px; font-weight:600; line-height:1.1; }
.now-range{ color:var(--muted); font-size:14px; }
.now-comment{
  margin-left:auto;
  font-size:12.5px;
  color:var(--accent-ink);
  background:var(--accent-soft);
  padding:5px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.now-flex{ display:flex; flex-direction:column; gap:6px; }

/* Filter chips */
.chips{
  display:flex; gap:8px; flex-wrap:wrap;
  margin-bottom:22px;
}
.chip{
  display:flex; align-items:center; gap:7px;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  font-size:13px;
  cursor:pointer;
  color:var(--ink);
}
.chip .count{ color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
.chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
.chip .swatch{ width:9px; height:9px; border-radius:50%; display:inline-block; }

/* Schedule list */
.month-heading{
  position:sticky; top:0;
  background:var(--paper);
  padding:14px 2px 6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  z-index:2;
}
.week-row{
  display:grid;
  grid-template-columns:104px 1fr auto;
  align-items:center;
  gap:14px;
  padding:12px 14px;
  border-radius:10px;
  background:var(--surface);
  border:1px solid var(--line);
  margin-bottom:6px;
}
.week-row.is-today{
  border-color:var(--status);
  box-shadow:0 0 0 1px var(--status);
}
.week-row.is-past{ opacity:.55; }
.week-row.is-changed{
  background:var(--changed-bg);
  border-color:var(--changed);
  box-shadow:0 0 0 1px var(--changed);
}
.week-row.is-changed.is-past{ opacity:.85; }
.week-dates{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:var(--muted);
  line-height:1.35;
}
.week-dates .yr{ font-size:10.5px; margin-top:1px; }
.week-mid{ min-width:0; }
.week-name{ font-size:15px; font-weight:600; }
.week-comment{ font-size:12.5px; color:var(--muted); margin-top:2px; }
.week-swatch{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; }
.week-badges{ display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
.badge-backup{
  font-size:10.5px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--status);
  background:var(--status-soft);
  padding:2px 7px;
  border-radius:999px;
  white-space:nowrap;
}
.badge-changed{
  font-size:10.5px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--changed-ink);
  background:var(--changed-soft);
  padding:2px 7px;
  border-radius:999px;
  white-space:nowrap;
}

.totals-foot{
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid var(--line);
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  font-size:12.5px;
  color:var(--muted);
}
.totals-foot b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }

.empty-msg{ color:var(--muted); font-size:14px; padding:24px 4px; text-align:center; }

@media (max-width:480px){
  .week-row{ grid-template-columns:88px 1fr; }
  .week-row .week-badges{ grid-column:2; justify-self:start; margin-top:4px; flex-direction:row; align-items:center; }
  .now-card{ flex-direction:column; align-items:flex-start; }
  .now-comment{ margin-left:0; }
}
</style>
</head>

function colorForIndex(i){
  const palette = ["#1C8C82","#C97A2E","#6E6FD1","#C24B84"];
  return palette[i % palette.length];
}

function fmtRange(startISO, endISO){
  const s = new Date(startISO + "T00:00:00");
  const e = new Date(endISO + "T00:00:00");
  const opts = { month:"short", day:"numeric" };
  const sStr = s.toLocaleDateString("en-US", opts);
  const eStr = e.toLocaleDateString("en-US", opts);
  return sStr + " \u2013 " + eStr;
}
function monthYearKey(iso){

let changedWeeksBySheet = {}; // computed once per load, keyed by sheet -> Set(start ISO)

// ---- Change detection: diff current SCHEDULE against what this browser saw last visit ----
function computeAndStoreChangedWeeks(sheetKey){
  const data = SCHEDULE[sheetKey];
  const storageKey = "sleep-oncall-snapshot-" + sheetKey;
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(storageKey)); } catch(e) { prev = null; }
  const changed = new Set();
  if (prev) {
    const prevByStart = {};
    prev.forEach(w => { prevByStart[w.start] = w; });
    data.weeks.forEach(w => {
      const pw = prevByStart[w.start];
      if (!pw || pw.onCall !== w.onCall || pw.comment !== w.comment || JSON.stringify(pw.values) !== JSON.stringify(w.values)) {
        changed.add(w.start);
      }
    });
  }
  changedWeeksBySheet[sheetKey] = changed;
  try {
    const snapshot = data.weeks.map(w => ({ start: w.start, onCall: w.onCall, comment: w.comment, values: w.values }));
    localStorage.setItem(storageKey, JSON.stringify(snapshot));
  } catch(e) {}
}
function primeChangedWeeks(){
  Object.keys(SCHEDULE).forEach(computeAndStoreChangedWeeks);
}

function buildTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  Object.keys(SCHEDULE).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "tab" + (key === activeSheet ? " active" : "");
    btn.textContent = SHEET_LABELS[key] || key;
    btn.onclick = () => { activeSheet = key; activeFilter = null; render(); };
    tabs.appendChild(btn);
  });
}

function buildNowCard(){
  const data = SCHEDULE[activeSheet];
  const today = todayISO();
  let current = data.weeks.find(w => w.start <= today && today <= w.end);
  const card = document.getElementById("now-card");
  if (!current) {
    current = data.weeks.find(w => w.start >= today) || data.weeks[data.weeks.length-1];
  }
  const isLive = current.start <= today && today <= current.end;
  const idx = data.people.indexOf(current.onCall);
  const color = colorForIndex(idx);
  card.innerHTML = `
    <div class="now-flex">
      <div class="now-badge"><span class="now-dot"></span>${isLive ? "On call this week" : "Next up"}</div>
      <div class="now-name" style="color:${color}">${current.onCall || "\u2014"}</div>
      <div class="now-range">${fmtRange(current.start, current.end)}</div>
    </div>
    ${current.comment ? `<div class="now-comment">${escapeHTML(current.comment)}</div>` : ""}
  `;
}

function buildChips(){
  const data = SCHEDULE[activeSheet];
  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  data.people.forEach((name, i) => {
    const chip = document.createElement("button");
    chip.className = "chip" + (activeFilter === name ? " active" : "");
    const total = data.totals[name] ?? 0;
    chip.innerHTML = `<span class="swatch" style="background:${colorForIndex(i)}"></span>${name} <span class="count">${total}</span>`;
    chip.onclick = () => { activeFilter = (activeFilter === name) ? null : name; render(); };
    chips.appendChild(chip);
  });
}

function buildList(){
  const data = SCHEDULE[activeSheet];
  const list = document.getElementById("list");
  list.innerHTML = "";
  const today = todayISO();
  const changedSet = changedWeeksBySheet[activeSheet] || new Set();
  const filtered = activeFilter ? data.weeks.filter(w => w.onCall === activeFilter) : data.weeks;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-msg">No weeks match this filter.</div>`;
    return;
  }

  let lastMonth = null;
  filtered.forEach(w => {
    const mk = monthYearKey(w.start);
    if (mk !== lastMonth) {
      const h = document.createElement("div");
      h.className = "month-heading";
      h.textContent = mk;
      list.appendChild(h);
      lastMonth = mk;
    }
    const idx = data.people.indexOf(w.onCall);
    const color = colorForIndex(idx);
    const isToday = w.start <= today && today <= w.end;
    const isPast = w.end < today;
    const backupUsed = w.onCall && w.values[w.onCall] === 2;
    const isChanged = changedSet.has(w.start);

    const row = document.createElement("div");
    row.className = "week-row" + (isToday ? " is-today" : "") + (isPast ? " is-past" : "") + (isChanged ? " is-changed" : "");
    const s = new Date(w.start + "T00:00:00");
    const e = new Date(w.end + "T00:00:00");
    row.innerHTML = `
      <div class="week-dates">${s.toLocaleDateString("en-US",{month:"short",day:"numeric"})}\u2013${e.toLocaleDateString("en-US",{day:"numeric"})}<div class="yr">${s.getFullYear()}</div></div>
      <div class="week-mid">
        <div class="week-name"><span class="week-swatch" style="background:${color}"></span>${w.onCall || "Unassigned"}</div>
        ${w.comment ? `<div class="week-comment">${escapeHTML(w.comment)}</div>` : ""}
      </div>
      <div class="week-badges">
        ${backupUsed ? `<span class="badge-backup">Covering</span>` : ""}
        ${isChanged ? `<span class="badge-changed">Updated</span>` : ""}
      </div>
    `;
    list.appendChild(row);
  });
}

function buildTotalsFoot(){
  const data = SCHEDULE[activeSheet];
  const foot = document.getElementById("totals-foot");
  foot.innerHTML = data.people.map(p => `<span>${p} <b>${data.totals[p] ?? 0}</b> wk${(data.totals[p]??0)===1?"":"s"}</span>`).join("");
}

function escapeHTML(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function render(){
  buildTabs();
  buildNowCard();
  buildChips();
  buildList();
  buildTotalsFoot();
  const d = new Date();
  document.getElementById("updated-label").textContent = "Updated " + d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}

// ---- Gate logic ----
function tryUnlock(){
  const input = document.getElementById("password").value;
  const err = document.getElementById("gate-error");
  if (input === PASSWORD) {
    try {
      localStorage.setItem("sleep-oncall-unlocked", "1");
    } catch(e) {}
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    primeChangedWeeks();
    render();
  } else {
    err.textContent = "That password isn't right \u2014 check with whoever sent you the link.";
  }
}
document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });

(function initialCheck(){
  let already = false;
  try { already = localStorage.getItem("sleep-oncall-unlocked") === "1"; } catch(e) {}
  if (already) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    primeChangedWeeks();
    render();
  }
})();
</script>
</body>
</html>
